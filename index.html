<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Acceso · Acumulado de Obras</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://script.google.com https://*.google.com https://*.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#050b14; --bg2:#081120;
  --panel:rgba(15,25,44,.72); --panel-solid:#0d1728;
  --border:rgba(94,140,255,.14); --border-hi:rgba(94,140,255,.32);
  --text:#e8eefb; --text-dim:#8fa3c4; --text-mute:#5a6c8c;
  --cyan:#22d3ee; --blue:#3b82f6; --violet:#a78bfa; --gold:#fbbf24;
  --red:#f87171; --green:#34d399; --pink:#f472b6;
  --glow-cyan:0 0 24px rgba(34,211,238,.35);
  --radius:18px;
  --font-d:'Sora',system-ui,sans-serif;
  --font-m:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-d);font-size:14px;line-height:1.45}
body{
  background:
    radial-gradient(1100px 560px at 85% -10%, rgba(59,130,246,.16), transparent 60%),
    radial-gradient(900px 520px at -10% 110%, rgba(34,211,238,.10), transparent 60%),
    radial-gradient(700px 500px at 50% 45%, rgba(167,139,250,.06), transparent 70%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  min-height:100vh;
}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.app{max-width:1560px;margin:0 auto;padding:26px 28px 70px}

/* ======= HEADER ======= */
.app-header{
  position:relative; overflow:hidden;
  display:flex;justify-content:space-between;align-items:flex-start;gap:32px;
  padding:26px 28px;border-radius:22px;
  background:linear-gradient(135deg, rgba(34,211,238,.10), rgba(59,130,246,.07) 45%, rgba(167,139,250,.09));
  border:1px solid var(--border-hi);
  box-shadow:0 18px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
}
.app-header::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.05) 48%, transparent 62%);
  animation:sheen 7s ease-in-out infinite;
}
@keyframes sheen{0%,100%{transform:translateX(-30%)}50%{transform:translateX(30%)}}
.brand{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.brand-orb{
  width:58px;height:58px;border-radius:16px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 25%, rgba(34,211,238,.35), rgba(59,130,246,.12) 60%, transparent),
             linear-gradient(160deg,#0d1b30,#0a1220);
  border:1px solid rgba(34,211,238,.4);
  box-shadow:var(--glow-cyan), inset 0 0 18px rgba(34,211,238,.15);
  animation:orbFloat 5s ease-in-out infinite;cursor:pointer;transition:transform .2s;
}
.brand-orb:hover{transform:scale(1.08) rotate(-4deg)}
.brand-orb:active{transform:scale(.94)}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.brand-title{font-size:22px;font-weight:800;letter-spacing:.06em;
  background:linear-gradient(90deg,#fff,#7dd3fc 55%,#a5b4fc);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-size:12px;color:var(--text-dim);margin-top:4px;letter-spacing:.04em}
.brand-sub b{color:var(--cyan);font-weight:600}
.meta-strip{display:flex;gap:26px;position:relative;z-index:1;flex-wrap:wrap}
.meta-strip>div{display:flex;flex-direction:column;gap:4px;padding:10px 16px;border-radius:14px;
  background:rgba(8,15,28,.55);border:1px solid var(--border);backdrop-filter:blur(6px)}
.meta-strip span{font-size:9.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.meta-strip b{font-size:14px;color:var(--text);font-weight:700;font-family:var(--font-m)}

/* ======= TABS ======= */
.tabs{display:flex;gap:6px;margin:20px 0 10px;padding:6px;border-radius:14px;
  background:rgba(10,18,32,.6);border:1px solid var(--border);align-items:center;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;color:var(--text-dim);padding:10px 18px;font-size:12px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:10px;font-family:inherit;
  transition:all .25s ease;white-space:nowrap;position:relative}
.tab:hover{color:var(--text)}
.tab.active{color:#04121c;background:linear-gradient(135deg,var(--cyan),#38bdf8);
  box-shadow:0 4px 18px rgba(34,211,238,.4)}
.tabs-spacer{flex:1}
.filter-clear{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.45);color:#fca5a5;
  padding:8px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-radius:10px;
  cursor:pointer;font-family:inherit;font-weight:700;transition:all .2s}
.filter-clear:hover{background:rgba(248,113,113,.22);transform:translateY(-1px)}

/* ======= FILTER BAR ======= */
.filter-bar{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start;
  background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--border);
  border-radius:16px;padding:16px 20px;margin-bottom:16px}
.filter-group{display:flex;flex-direction:column;gap:7px}
.filter-group-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-mute);font-weight:700}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip-toggle{font-family:var(--font-m);font-size:12px;padding:6px 14px;border-radius:999px;
  border:1px solid var(--border-hi);background:transparent;color:var(--text-dim);cursor:pointer;
  transition:all .18s ease}
.chip-toggle:hover{border-color:var(--cyan);color:var(--text);transform:translateY(-1px)}
.chip-toggle.active{font-weight:700}
.chips{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;align-items:center}
.chip{background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.35);color:var(--cyan);
  padding:5px 12px;font-size:11px;border-radius:8px;cursor:pointer;font-family:var(--font-m);
  animation:chipPop .3s cubic-bezier(.34,1.56,.64,1)}
.chip b{color:var(--text);margin:0 4px}
.chip-info{color:var(--text-mute);font-size:11px;font-family:var(--font-m);margin-left:8px}
@keyframes chipPop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}

/* ======= KPIs ======= */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin:20px 0}
.stat{position:relative;overflow:hidden;
  background:linear-gradient(165deg,var(--panel) 0%,rgba(8,14,26,.9) 140%);
  backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  animation:fadeUp .55s cubic-bezier(.22,1,.36,1) backwards}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;
  background:linear-gradient(90deg,transparent,var(--sc,var(--cyan)),transparent)}
.stat:hover{transform:translateY(-4px);border-color:var(--border-hi);
  box-shadow:0 16px 40px rgba(0,0,0,.45)}
.stat-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-mute);font-weight:700}
.stat-value{font-family:var(--font-m);font-size:24px;font-weight:700;margin-top:9px;letter-spacing:-.02em;color:var(--sc,var(--text))}
.stat-hint{font-size:11px;color:var(--text-dim);margin-top:6px;font-family:var(--font-m)}
.stat-spark{position:absolute;right:10px;bottom:8px;opacity:.7}

/* ======= GRID / PANELS ======= */
.grid-12{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.col-4{grid-column:span 4}.col-5{grid-column:span 5}.col-6{grid-column:span 6}
.col-7{grid-column:span 7}.col-8{grid-column:span 8}.col-12{grid-column:span 12}
.panel{position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--panel) 0%,rgba(8,14,26,.88) 150%);
  backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:0 8px 32px rgba(0,0,0,.35);
  display:flex;flex-direction:column;
  transition:border-color .25s ease, box-shadow .25s ease}
.panel:hover{border-color:var(--border-hi);box-shadow:0 14px 44px rgba(0,0,0,.5)}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(34,211,238,.6),transparent);
  background-size:200% 100%;opacity:0;transition:opacity .3s;animation:shimmer 2.4s linear infinite;pointer-events:none}
.panel:hover::before{opacity:1}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.panel-sub{font-size:11px;color:var(--text-dim);margin-top:3px}
.panel-body{padding:20px;flex:1}
.panel-body-flush{flex:1;overflow:hidden}

/* ======= CHART TOGGLES ======= */
.chart-toggle{display:flex;background:rgba(8,15,28,.7);border:1px solid var(--border);
  border-radius:999px;padding:3px;gap:2px}
.chart-toggle button{background:transparent;border:0;color:var(--text-dim);font-size:10px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:999px;cursor:pointer;
  font-family:inherit;transition:all .25s}
.chart-toggle button.active{background:linear-gradient(135deg,var(--cyan),#38bdf8);color:#04121c;
  box-shadow:0 2px 12px rgba(34,211,238,.4)}

/* ======= CHART SHARED ======= */
.chart-wrap{width:100%}
.chart-svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap;font-size:11px;color:var(--text-dim)}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-item i{display:inline-block;width:10px;height:10px;border-radius:3px}
.chart-bar-rect{transform-box:fill-box;transform-origin:bottom;animation:barGrow .6s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes barGrow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
.donut-pop{animation:popIn .55s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes popIn{0%{opacity:0;transform:scale(.7) rotate(-6deg)}70%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
.donut-arc{transition:stroke-dasharray .8s cubic-bezier(.4,0,.2,1),stroke-dashoffset .8s cubic-bezier(.4,0,.2,1),stroke-width .2s,r .2s}
.area-fill-fade{opacity:0;animation:fadeArea 1s ease .3s forwards}
@keyframes fadeArea{to{opacity:1}}
.area-line-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawLine 1.4s cubic-bezier(.22,1,.36,1) forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
.area-dot{opacity:0;transform-box:fill-box;transform-origin:center;animation:dotPop .3s ease forwards;transition:r .15s;cursor:pointer}
@keyframes dotPop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.chart-tooltip{animation:fadeInUp .15s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes rosePop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.rose-petal{transition:opacity .25s,filter .25s,transform .25s;transform-origin:center;cursor:pointer;animation:rosePop .5s cubic-bezier(.34,1.56,.64,1) backwards}

/* ======= MIX / DONUT LIST ======= */
.mix-wrap{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.mix-list{flex:1;min-width:220px;display:flex;flex-direction:column;gap:9px}
.mix-row{display:grid;grid-template-columns:12px 1fr auto auto;align-items:center;gap:10px;
  padding:10px 12px;background:rgba(20,32,55,.5);border:1px solid var(--border);
  border-radius:10px;font-size:12px;cursor:pointer;transition:all .18s}
.mix-row:hover{border-color:var(--border-hi);transform:translateX(3px)}
.mix-row.sel{border-color:var(--cyan);background:rgba(34,211,238,.08);box-shadow:0 0 0 1px rgba(34,211,238,.25)}
.mix-row i{width:10px;height:10px;border-radius:3px}
.mix-row span{color:var(--text-dim)}
.mix-row b{font-family:var(--font-m);font-weight:600}
.mix-row em{font-style:normal;font-family:var(--font-m);font-size:11px;color:var(--text-mute)}
.tipo-select-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tipo-pill{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
  padding:6px 14px 6px 9px;border-radius:999px;border:1px solid var(--border-hi);
  color:var(--text-dim);cursor:pointer;transition:all .2s;font-family:inherit}
.tipo-pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tipo-pill.active{color:#04121c}
.tipo-pill.active i{background:#04121c !important}
.tipo-pill:not(.active):hover{border-color:var(--cyan);color:var(--text)}

/* ======= RADIAL PROGRESS ======= */
.radial-progress{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.radial-label{position:absolute;font-weight:700;color:var(--text);font-family:var(--font-m)}
.radial-arc{transition:stroke-dasharray .9s cubic-bezier(.22,1,.36,1)}
.radial-spin-ring circle{animation:radialSpin 3.2s linear infinite;transform-origin:center}
@keyframes radialSpin{to{transform:rotate(360deg)}}
.radial-tip{transition:cx .9s cubic-bezier(.22,1,.36,1),cy .9s cubic-bezier(.22,1,.36,1)}

/* ======= CARDS (quin/ejecutor) ======= */
.quin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.quin-card{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:14px;
  padding:18px;background:rgba(20,32,55,.45);animation:fadeUp .5s cubic-bezier(.22,1,.36,1) backwards;
  transition:transform .2s, border-color .2s}
.quin-card:hover{transform:translateY(-3px);border-color:var(--border-hi)}
.quin-card::after{content:'';position:absolute;top:-40%;right:-20%;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle, var(--qc,rgba(34,211,238,.12)), transparent 70%);pointer-events:none}
.quin-head{display:flex;justify-content:space-between;align-items:flex-start}
.quin-label{font-family:var(--font-m);font-size:11px;color:var(--text-mute);letter-spacing:.1em}
.quin-range{font-size:16px;font-weight:800;margin-top:4px}
.quin-sub{color:var(--text-dim);font-weight:400;font-size:12px}
.quin-bar{height:7px;background:rgba(94,140,255,.12);border-radius:4px;margin:16px 0 12px;overflow:hidden}
.quin-bar-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.22,1,.36,1)}
.quin-rows{display:flex;flex-direction:column;gap:7px;font-size:12px}
.quin-row{display:flex;justify-content:space-between}
.quin-row span{color:var(--text-dim)}
.quin-row b{font-family:var(--font-m)}

/* ======= BAR LIST ======= */
.bar-list{display:flex;flex-direction:column;gap:12px}
.bar-list.big{gap:16px}
.bar-row{cursor:pointer;padding:12px;border:1px solid transparent;border-radius:10px;
  transition:all .18s;animation:fadeUp .45s cubic-bezier(.22,1,.36,1) backwards}
.bar-row:hover{background:rgba(20,32,55,.5);transform:translateX(3px)}
.bar-row.sel{border-color:var(--cyan);background:rgba(34,211,238,.07);
  box-shadow:0 0 0 1px rgba(34,211,238,.2), 0 4px 16px rgba(34,211,238,.1)}
.bar-row-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar-code{display:flex;align-items:center;gap:8px;font-size:13px}
.bar-code i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.bar-code em{font-style:normal;color:var(--text-mute);font-size:11px;font-family:var(--font-m)}
.bar-amt{font-size:13px;font-weight:700}
.bar-track{height:7px;background:rgba(94,140,255,.12);border-radius:4px;margin:9px 0;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .7s cubic-bezier(.22,1,.36,1)}
.bar-row-foot{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--text-dim)}

/* ======= CLASE GRID ======= */
.clase-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.clase-card{background:rgba(20,32,55,.5);border:1px solid var(--border);border-radius:12px;
  padding:16px;cursor:pointer;transition:all .18s;animation:fadeUp .45s backwards}
.clase-card:hover{transform:translateY(-2px);border-color:var(--border-hi)}
.clase-head{display:flex;justify-content:space-between;align-items:center}
.clase-name{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em}
.clase-name i{width:10px;height:10px;border-radius:3px}
.clase-pct{font-size:13px;color:var(--text-dim);font-family:var(--font-m)}
.clase-amt{font-family:var(--font-m);font-size:22px;font-weight:700;margin:9px 0 4px}
.clase-meta{font-size:11px;color:var(--text-mute);font-family:var(--font-m)}
.clase-bar{height:5px;background:rgba(94,140,255,.12);border-radius:3px;margin-top:11px;overflow:hidden}
.clase-bar div{height:100%;border-radius:3px;transition:width .7s cubic-bezier(.22,1,.36,1)}

/* ======= TABLES ======= */
.table{width:100%;border-collapse:collapse;font-size:12px}
.table thead th{text-align:left;padding:11px 13px;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--text-mute);border-bottom:1px solid var(--border);
  background:rgba(13,23,40,.95);font-weight:700}
.table th.r,.table td.r{text-align:right}
.table tbody td{padding:10px 13px;border-bottom:1px solid rgba(94,140,255,.07);color:var(--text-dim)}
.table tbody td.strong{color:var(--text);font-weight:600}
.table tbody tr{transition:background .15s;animation:fadeUp .4s backwards}
.table tbody tr:hover{background:rgba(34,211,238,.045)}
.table tbody tr.sel{background:rgba(34,211,238,.08)}
.table tbody tr.clickable{cursor:pointer}
.table tbody tr.total-row{background:rgba(94,140,255,.06);font-weight:700;cursor:default}
.table tbody tr.total-row td{color:var(--text);font-size:11.5px;text-transform:uppercase;
  letter-spacing:.06em;font-weight:800;border-top:1px solid var(--border-hi)}
.table.dense thead th{padding:9px 11px}
.table.dense tbody td{padding:8px 11px}
.table .trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.table .trunc-sm{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.table-scroll{max-height:72vh;overflow:auto}
.table-scroll thead th,.sed-table-wrap thead th{position:sticky;top:0;z-index:2}
.sed-table-wrap{max-height:640px;overflow:auto}
.badge{display:inline-block;font-family:var(--font-m);font-size:10px;padding:3px 9px;
  border:1px solid;border-radius:999px;font-weight:600;letter-spacing:.04em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
.search{background:rgba(20,32,55,.6);border:1px solid var(--border);color:var(--text);
  padding:8px 13px;border-radius:10px;font-family:inherit;font-size:12px;width:240px}
.search:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.foot{margin-top:32px;padding-top:18px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  font-size:11px;color:var(--text-mute);font-family:var(--font-m)}

/* ======= STAGGER ======= */
.kpis>.stat:nth-child(1){animation-delay:.03s}.kpis>.stat:nth-child(2){animation-delay:.06s}
.kpis>.stat:nth-child(3){animation-delay:.09s}.kpis>.stat:nth-child(4){animation-delay:.12s}
.kpis>.stat:nth-child(5){animation-delay:.15s}.kpis>.stat:nth-child(6){animation-delay:.18s}
.bar-list>.bar-row:nth-child(1){animation-delay:.03s}.bar-list>.bar-row:nth-child(2){animation-delay:.06s}
.bar-list>.bar-row:nth-child(3){animation-delay:.09s}.bar-list>.bar-row:nth-child(4){animation-delay:.12s}
.bar-list>.bar-row:nth-child(5){animation-delay:.15s}.bar-list>.bar-row:nth-child(6){animation-delay:.18s}
.bar-list>.bar-row:nth-child(7){animation-delay:.21s}.bar-list>.bar-row:nth-child(8){animation-delay:.24s}
.quin-grid>.quin-card:nth-child(1){animation-delay:.04s}.quin-grid>.quin-card:nth-child(2){animation-delay:.09s}
