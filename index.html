<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Acceso · Acumulado de Obras</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#05060a"><meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://script.google.com https://*.google.com https://*.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#050b14; --bg2:#081120;
  --panel:rgba(15,25,44,.72); --panel-solid:#0d1728;
  --border:rgba(94,140,255,.14); --border-hi:rgba(94,140,255,.32);
  --text:#e8eefb; --text-dim:#8fa3c4; --text-mute:#5a6c8c;
  --cyan:#22d3ee; --blue:#3b82f6; --violet:#a78bfa; --gold:#fbbf24;
  --red:#f87171; --green:#34d399; --pink:#f472b6;
  --glow-cyan:0 0 24px rgba(34,211,238,.35);
  --radius:18px;
  --font-d:'Manrope',system-ui,sans-serif;
  --font-m:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-d);font-size:14px;line-height:1.45}
body{
  background:
    radial-gradient(1100px 560px at 85% -10%, rgba(59,130,246,.16), transparent 60%),
    radial-gradient(900px 520px at -10% 110%, rgba(34,211,238,.10), transparent 60%),
    radial-gradient(700px 500px at 50% 45%, rgba(167,139,250,.06), transparent 70%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  min-height:100vh;
}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.app{max-width:1560px;margin:0 auto;padding:26px 28px 70px}

/* ======= HEADER ======= */
.app-header{
  position:relative; overflow:hidden;
  display:flex;justify-content:space-between;align-items:flex-start;gap:32px;
  padding:26px 28px;border-radius:22px;
  background:linear-gradient(135deg, rgba(34,211,238,.10), rgba(59,130,246,.07) 45%, rgba(167,139,250,.09));
  border:1px solid var(--border-hi);
  box-shadow:0 18px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
}
.app-header::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.05) 48%, transparent 62%);
  animation:sheen 7s ease-in-out infinite;
}
@keyframes sheen{0%,100%{transform:translateX(-30%)}50%{transform:translateX(30%)}}
.brand{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.brand-orb{
  width:58px;height:58px;border-radius:16px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 25%, rgba(34,211,238,.35), rgba(59,130,246,.12) 60%, transparent),
             linear-gradient(160deg,#0d1b30,#0a1220);
  border:1px solid rgba(34,211,238,.4);
  box-shadow:var(--glow-cyan), inset 0 0 18px rgba(34,211,238,.15);
  animation:orbFloat 5s ease-in-out infinite;cursor:pointer;transition:transform .2s;
}
.brand-orb:hover{transform:scale(1.08) rotate(-4deg)}
.brand-orb:active{transform:scale(.94)}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.brand-title{font-size:22px;font-weight:800;letter-spacing:.06em;
  background:linear-gradient(90deg,#fff,#7dd3fc 55%,#a5b4fc);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-size:12px;color:var(--text-dim);margin-top:4px;letter-spacing:.04em}
.brand-sub b{color:var(--cyan);font-weight:600}
.meta-strip{display:flex;gap:26px;position:relative;z-index:1;flex-wrap:wrap}
.meta-strip>div{display:flex;flex-direction:column;gap:4px;padding:10px 16px;border-radius:14px;
  background:rgba(8,15,28,.55);border:1px solid var(--border);backdrop-filter:blur(6px)}
.meta-strip span{font-size:9.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.meta-strip b{font-size:14px;color:var(--text);font-weight:700;font-family:var(--font-m)}

/* ======= TABS ======= */
.tabs{display:flex;gap:6px;margin:20px 0 10px;padding:6px;border-radius:14px;
  background:rgba(10,18,32,.6);border:1px solid var(--border);align-items:center;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;color:var(--text-dim);padding:10px 18px;font-size:12px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:10px;font-family:inherit;
  transition:all .25s ease;white-space:nowrap;position:relative}
.tab:hover{color:var(--text)}
.tab.active{color:#04121c;background:linear-gradient(135deg,var(--cyan),#38bdf8);
  box-shadow:0 4px 18px rgba(34,211,238,.4)}
.tabs-spacer{flex:1}
.filter-clear{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.45);color:#fca5a5;
  padding:8px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-radius:10px;
  cursor:pointer;font-family:inherit;font-weight:700;transition:all .2s}
.filter-clear:hover{background:rgba(248,113,113,.22);transform:translateY(-1px)}

/* ======= FILTER BAR ======= */
.filter-bar{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start;
  background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--border);
  border-radius:16px;padding:16px 20px;margin-bottom:16px}
.filter-group{display:flex;flex-direction:column;gap:7px}
.filter-group-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-mute);font-weight:700}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip-toggle{font-family:var(--font-m);font-size:12px;padding:6px 14px;border-radius:999px;
  border:1px solid var(--border-hi);background:transparent;color:var(--text-dim);cursor:pointer;
  transition:all .18s ease}
.chip-toggle:hover{border-color:var(--cyan);color:var(--text);transform:translateY(-1px)}
.chip-toggle.active{font-weight:700}
.chips{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;align-items:center}
.chip{background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.35);color:var(--cyan);
  padding:5px 12px;font-size:11px;border-radius:8px;cursor:pointer;font-family:var(--font-m);
  animation:chipPop .3s cubic-bezier(.34,1.56,.64,1)}
.chip b{color:var(--text);margin:0 4px}
.chip-info{color:var(--text-mute);font-size:11px;font-family:var(--font-m);margin-left:8px}
@keyframes chipPop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}

/* ======= KPIs ======= */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin:20px 0}
.stat{position:relative;overflow:hidden;
  background:linear-gradient(165deg,var(--panel) 0%,rgba(8,14,26,.9) 140%);
  backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  animation:fadeUp .55s cubic-bezier(.22,1,.36,1) backwards}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;
  background:linear-gradient(90deg,transparent,var(--sc,var(--cyan)),transparent)}
.stat:hover{transform:translateY(-4px);border-color:var(--border-hi);
  box-shadow:0 16px 40px rgba(0,0,0,.45)}
.stat-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-mute);font-weight:700}
.stat-value{font-family:var(--font-m);font-size:24px;font-weight:700;margin-top:9px;letter-spacing:-.02em;color:var(--sc,var(--text))}
.stat-hint{font-size:11px;color:var(--text-dim);margin-top:6px;font-family:var(--font-m)}
.stat-spark{position:absolute;right:10px;bottom:8px;opacity:.7}

/* ======= GRID / PANELS ======= */
.grid-12{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.col-4{grid-column:span 4}.col-5{grid-column:span 5}.col-6{grid-column:span 6}
.col-7{grid-column:span 7}.col-8{grid-column:span 8}.col-12{grid-column:span 12}
.panel{position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--panel) 0%,rgba(8,14,26,.88) 150%);
  backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:0 8px 32px rgba(0,0,0,.35);
  display:flex;flex-direction:column;
  transition:border-color .25s ease, box-shadow .25s ease}
.panel:hover{border-color:var(--border-hi);box-shadow:0 14px 44px rgba(0,0,0,.5)}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(34,211,238,.6),transparent);
  background-size:200% 100%;opacity:0;transition:opacity .3s;animation:shimmer 2.4s linear infinite;pointer-events:none}
.panel:hover::before{opacity:1}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.panel-sub{font-size:11px;color:var(--text-dim);margin-top:3px}
.panel-body{padding:20px;flex:1}
.panel-body-flush{flex:1;overflow:hidden}

/* ======= CHART TOGGLES ======= */
.chart-toggle{display:flex;background:rgba(8,15,28,.7);border:1px solid var(--border);
  border-radius:999px;padding:3px;gap:2px}
.chart-toggle button{background:transparent;border:0;color:var(--text-dim);font-size:10px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:999px;cursor:pointer;
  font-family:inherit;transition:all .25s}
.chart-toggle button.active{background:linear-gradient(135deg,var(--cyan),#38bdf8);color:#04121c;
  box-shadow:0 2px 12px rgba(34,211,238,.4)}

/* ======= CHART SHARED ======= */
.chart-wrap{width:100%}
.chart-svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap;font-size:11px;color:var(--text-dim)}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-item i{display:inline-block;width:10px;height:10px;border-radius:3px}
.chart-bar-rect{transform-box:fill-box;transform-origin:bottom;animation:barGrow .6s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes barGrow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
.donut-pop{animation:popIn .55s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes popIn{0%{opacity:0;transform:scale(.7) rotate(-6deg)}70%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
.donut-arc{transition:stroke-dasharray .8s cubic-bezier(.4,0,.2,1),stroke-dashoffset .8s cubic-bezier(.4,0,.2,1),stroke-width .2s,r .2s}
.area-fill-fade{opacity:0;animation:fadeArea 1s ease .3s forwards}
@keyframes fadeArea{to{opacity:1}}
.area-line-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawLine 1.4s cubic-bezier(.22,1,.36,1) forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
.area-dot{opacity:0;transform-box:fill-box;transform-origin:center;animation:dotPop .3s ease forwards;transition:r .15s;cursor:pointer}
@keyframes dotPop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.chart-tooltip{animation:fadeInUp .15s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes rosePop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.rose-petal{transition:opacity .25s,filter .25s,transform .25s;transform-origin:center;cursor:pointer;animation:rosePop .5s cubic-bezier(.34,1.56,.64,1) backwards}

/* ======= MIX / DONUT LIST ======= */
.mix-wrap{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.mix-list{flex:1;min-width:220px;display:flex;flex-direction:column;gap:9px}
.mix-row{display:grid;grid-template-columns:12px 1fr auto auto;align-items:center;gap:10px;
  padding:10px 12px;background:rgba(20,32,55,.5);border:1px solid var(--border);
  border-radius:10px;font-size:12px;cursor:pointer;transition:all .18s}
.mix-row:hover{border-color:var(--border-hi);transform:translateX(3px)}
.mix-row.sel{border-color:var(--cyan);background:rgba(34,211,238,.08);box-shadow:0 0 0 1px rgba(34,211,238,.25)}
.mix-row i{width:10px;height:10px;border-radius:3px}
.mix-row span{color:var(--text-dim)}
.mix-row b{font-family:var(--font-m);font-weight:600}
.mix-row em{font-style:normal;font-family:var(--font-m);font-size:11px;color:var(--text-mute)}
.tipo-select-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tipo-pill{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
  padding:6px 14px 6px 9px;border-radius:999px;border:1px solid var(--border-hi);
  color:var(--text-dim);cursor:pointer;transition:all .2s;font-family:inherit}
.tipo-pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tipo-pill.active{color:#04121c}
.tipo-pill.active i{background:#04121c !important}
.tipo-pill:not(.active):hover{border-color:var(--cyan);color:var(--text)}

/* ======= RADIAL PROGRESS ======= */
.radial-progress{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.radial-label{position:absolute;font-weight:700;color:var(--text);font-family:var(--font-m)}
.radial-arc{transition:stroke-dasharray .9s cubic-bezier(.22,1,.36,1)}
.radial-spin-ring circle{animation:radialSpin 3.2s linear infinite;transform-origin:center}
@keyframes radialSpin{to{transform:rotate(360deg)}}
.radial-tip{transition:cx .9s cubic-bezier(.22,1,.36,1),cy .9s cubic-bezier(.22,1,.36,1)}

/* ======= CARDS (quin/ejecutor) ======= */
.quin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.quin-card{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:14px;
  padding:18px;background:rgba(20,32,55,.45);animation:fadeUp .5s cubic-bezier(.22,1,.36,1) backwards;
  transition:transform .2s, border-color .2s}
.quin-card:hover{transform:translateY(-3px);border-color:var(--border-hi)}
.quin-card::after{content:'';position:absolute;top:-40%;right:-20%;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle, var(--qc,rgba(34,211,238,.12)), transparent 70%);pointer-events:none}
.quin-head{display:flex;justify-content:space-between;align-items:flex-start}
.quin-label{font-family:var(--font-m);font-size:11px;color:var(--text-mute);letter-spacing:.1em}
.quin-range{font-size:16px;font-weight:800;margin-top:4px}
.quin-sub{color:var(--text-dim);font-weight:400;font-size:12px}
.quin-bar{height:7px;background:rgba(94,140,255,.12);border-radius:4px;margin:16px 0 12px;overflow:hidden}
.quin-bar-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.22,1,.36,1)}
.quin-rows{display:flex;flex-direction:column;gap:7px;font-size:12px}
.quin-row{display:flex;justify-content:space-between}
.quin-row span{color:var(--text-dim)}
.quin-row b{font-family:var(--font-m)}

/* ======= BAR LIST ======= */
.bar-list{display:flex;flex-direction:column;gap:12px}
.bar-list.big{gap:16px}
.bar-row{cursor:pointer;padding:12px;border:1px solid transparent;border-radius:10px;
  transition:all .18s;animation:fadeUp .45s cubic-bezier(.22,1,.36,1) backwards}
.bar-row:hover{background:rgba(20,32,55,.5);transform:translateX(3px)}
.bar-row.sel{border-color:var(--cyan);background:rgba(34,211,238,.07);
  box-shadow:0 0 0 1px rgba(34,211,238,.2), 0 4px 16px rgba(34,211,238,.1)}
.bar-row-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar-code{display:flex;align-items:center;gap:8px;font-size:13px}
.bar-code i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.bar-code em{font-style:normal;color:var(--text-mute);font-size:11px;font-family:var(--font-m)}
.bar-amt{font-size:13px;font-weight:700}
.bar-track{height:7px;background:rgba(94,140,255,.12);border-radius:4px;margin:9px 0;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .7s cubic-bezier(.22,1,.36,1)}
.bar-row-foot{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--text-dim)}

/* ======= CLASE GRID ======= */
.clase-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.clase-card{background:rgba(20,32,55,.5);border:1px solid var(--border);border-radius:12px;
  padding:16px;cursor:pointer;transition:all .18s;animation:fadeUp .45s backwards}
.clase-card:hover{transform:translateY(-2px);border-color:var(--border-hi)}
.clase-head{display:flex;justify-content:space-between;align-items:center}
.clase-name{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em}
.clase-name i{width:10px;height:10px;border-radius:3px}
.clase-pct{font-size:13px;color:var(--text-dim);font-family:var(--font-m)}
.clase-amt{font-family:var(--font-m);font-size:22px;font-weight:700;margin:9px 0 4px}
.clase-meta{font-size:11px;color:var(--text-mute);font-family:var(--font-m)}
.clase-bar{height:5px;background:rgba(94,140,255,.12);border-radius:3px;margin-top:11px;overflow:hidden}
.clase-bar div{height:100%;border-radius:3px;transition:width .7s cubic-bezier(.22,1,.36,1)}

/* ======= TABLES ======= */
.table{width:100%;border-collapse:collapse;font-size:12px}
.table thead th{text-align:left;padding:11px 13px;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--text-mute);border-bottom:1px solid var(--border);
  background:rgba(13,23,40,.95);font-weight:700}
.table th.r,.table td.r{text-align:right}
.table tbody td{padding:10px 13px;border-bottom:1px solid rgba(94,140,255,.07);color:var(--text-dim)}
.table tbody td.strong{color:var(--text);font-weight:600}
.table tbody tr{transition:background .15s;animation:fadeUp .4s backwards}
.table tbody tr:hover{background:rgba(34,211,238,.045)}
.table tbody tr.sel{background:rgba(34,211,238,.08)}
.table tbody tr.clickable{cursor:pointer}
.table tbody tr.total-row{background:rgba(94,140,255,.06);font-weight:700;cursor:default}
.table tbody tr.total-row td{color:var(--text);font-size:11.5px;text-transform:uppercase;
  letter-spacing:.06em;font-weight:800;border-top:1px solid var(--border-hi)}
.table.dense thead th{padding:9px 11px}
.table.dense tbody td{padding:8px 11px}
.table .trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.table .trunc-sm{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.table-scroll{max-height:72vh;overflow:auto}
.table-scroll thead th,.sed-table-wrap thead th{position:sticky;top:0;z-index:2}
.sed-table-wrap{max-height:640px;overflow:auto}
.badge{display:inline-block;font-family:var(--font-m);font-size:10px;padding:3px 9px;
  border:1px solid;border-radius:999px;font-weight:600;letter-spacing:.04em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
.search{background:rgba(20,32,55,.6);border:1px solid var(--border);color:var(--text);
  padding:8px 13px;border-radius:10px;font-family:inherit;font-size:12px;width:240px}
.search:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.foot{margin-top:32px;padding-top:18px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  font-size:11px;color:var(--text-mute);font-family:var(--font-m)}

/* ======= STAGGER ======= */
.kpis>.stat:nth-child(1){animation-delay:.03s}.kpis>.stat:nth-child(2){animation-delay:.06s}
.kpis>.stat:nth-child(3){animation-delay:.09s}.kpis>.stat:nth-child(4){animation-delay:.12s}
.kpis>.stat:nth-child(5){animation-delay:.15s}.kpis>.stat:nth-child(6){animation-delay:.18s}
.bar-list>.bar-row:nth-child(1){animation-delay:.03s}.bar-list>.bar-row:nth-child(2){animation-delay:.06s}
.bar-list>.bar-row:nth-child(3){animation-delay:.09s}.bar-list>.bar-row:nth-child(4){animation-delay:.12s}
.bar-list>.bar-row:nth-child(5){animation-delay:.15s}.bar-list>.bar-row:nth-child(6){animation-delay:.18s}
.bar-list>.bar-row:nth-child(7){animation-delay:.21s}.bar-list>.bar-row:nth-child(8){animation-delay:.24s}

/* ================= VOLT · rediseño visual ================= */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
--bg:#05060a;--bg2:#090b12;--panel:rgba(16,18,28,.74);--panel-solid:#10121c;
--border:rgba(255,214,10,.13);--border-hi:rgba(255,214,10,.42);
--text:#f5f6fa;--text-dim:#a9aec2;--text-mute:#6e7490;
--cyan:#ffd60a;--blue:#3d7bff;--violet:#9b6bff;--gold:#ff9f1c;--red:#ff5c70;--green:#2be3a1;--pink:#ff4fa3;
--glow-cyan:0 0 28px rgba(255,214,10,.4);--volt:#ffd60a;--arc:#6fb7ff;
--font-d:'Manrope',system-ui,sans-serif;--font-h:'Unbounded','Manrope',sans-serif;--font-m:'JetBrains Mono',monospace}
*{scrollbar-width:thin;scrollbar-color:rgba(255,214,10,.35) transparent}
::selection{background:var(--volt);color:#111}
body{background:
radial-gradient(900px 520px at 90% -8%,rgba(61,123,255,.2),transparent 62%),
radial-gradient(800px 520px at -8% 105%,rgba(255,214,10,.11),transparent 60%),
linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px) 0 0/44px 44px,
linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px) 0 0/44px 44px,
linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:2px;z-index:10000;pointer-events:none;
background:linear-gradient(90deg,transparent,var(--volt),#fff,var(--arc),transparent);background-size:240% 100%;
animation:vflow 3.6s linear infinite;box-shadow:0 0 14px rgba(255,214,10,.6)}
#volt{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
@keyframes vflow{to{background-position:-240% 0}}
@keyframes vshine{0%,35%{transform:translateX(-120%)}70%,100%{transform:translateX(120%)}}
@keyframes vspin{to{--ang:360deg}}
@keyframes vring{0%{box-shadow:0 0 0 0 rgba(255,214,10,.55),0 10px 34px rgba(255,200,0,.45)}100%{box-shadow:0 0 0 22px rgba(255,214,10,0),0 10px 34px rgba(255,200,0,.45)}}

/* borde eléctrico giratorio */
.app-header::after,#gf::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
background:conic-gradient(from var(--ang),transparent 0 60%,var(--volt) 77%,#fff 82%,var(--arc) 86%,transparent 92%);
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
animation:vspin 5s linear infinite;filter:drop-shadow(0 0 6px var(--volt))}

/* cabecera */
.app-header{border:0;border-radius:22px;padding:28px 30px;
background:linear-gradient(120deg,rgba(255,214,10,.1),rgba(16,18,28,.82) 38%,rgba(61,123,255,.13));
box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
.app-header::before{background:linear-gradient(115deg,transparent 35%,rgba(255,214,10,.08) 50%,transparent 65%)}
.brand-orb{width:62px;height:62px;border-radius:18px;border:0;color:#1a1300;font-size:28px;
background:linear-gradient(145deg,#ffe55c,#ffb400);animation:orbFloat 5s ease-in-out infinite,vring 2.4s ease-out infinite}
.brand-title{font-family:var(--font-h);font-size:20px;font-weight:800;letter-spacing:.03em;
background:linear-gradient(90deg,#fff 25%,var(--volt));-webkit-background-clip:text;background-clip:text}
.brand-sub{color:var(--text-dim)}.brand-sub b{color:var(--volt)}
.meta-strip>div{background:rgba(255,255,255,.04);border:1px solid var(--border);border-left:2px solid var(--volt);border-radius:12px}
.meta-strip b{color:#fff}

/* pestañas */
.tabs{position:sticky;top:10px;z-index:20;background:rgba(12,14,22,.72);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(14px)}

.tab.active{color:#171100;background:linear-gradient(135deg,#ffe14d,#ffb700);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 6px 22px rgba(255,200,0,.45)}
.tab.active::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);animation:vshine 2.8s ease-in-out infinite}

/* filtros */
.filter-bar{background:rgba(14,16,25,.7);border-radius:18px}
.filter-group-label{color:var(--text-mute);letter-spacing:.14em}
.chip-toggle{border-radius:10px;border-color:rgba(255,255,255,.12)}

.chip-toggle.active{box-shadow:0 0 18px rgba(255,214,10,.28)}
.chip{background:rgba(255,214,10,.1);border-color:rgba(255,214,10,.4);color:var(--volt);border-radius:10px}
.search{background:rgba(255,255,255,.04);border-radius:12px}
.search:focus{border-color:var(--volt);box-shadow:0 0 0 3px rgba(255,214,10,.16),0 0 24px rgba(255,214,10,.15)}

/* KPIs */
.stat{border-radius:18px;background:linear-gradient(165deg,rgba(23,26,40,.92),rgba(10,12,19,.82));
transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}
.stat::before{height:2px;background:linear-gradient(90deg,transparent,var(--volt),#fff,var(--arc),transparent);background-size:220% 100%;animation:vflow 3.2s linear infinite}
.stat::after{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;pointer-events:none;
background:radial-gradient(circle,rgba(255,214,10,.17),transparent 70%);transition:transform .5s}
.stat:hover{transform:translateY(-5px);border-color:var(--border-hi);box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 34px rgba(255,214,10,.12)}
.stat:hover::after{transform:scale(2.3)}
.stat-label{letter-spacing:.14em}
.stat-value{text-shadow:0 0 22px color-mix(in srgb,currentColor 40%,transparent)}

/* paneles */
.panel{border-radius:20px;background:linear-gradient(180deg,rgba(18,20,31,.84),rgba(9,11,18,.8));backdrop-filter:blur(10px)}
.panel::before{height:2px;background:linear-gradient(90deg,transparent,var(--volt),var(--arc),transparent);background-size:200% 100%;animation:vflow 4s linear infinite}
.panel:hover{border-color:var(--border-hi);box-shadow:0 20px 50px rgba(0,0,0,.55),0 0 40px rgba(255,214,10,.07)}
.panel-head{background:linear-gradient(90deg,rgba(255,214,10,.05),transparent 55%)}
.panel-title{font-family:var(--font-h);font-size:10.5px;letter-spacing:.08em}
.panel-title::before{content:'';display:inline-block;width:9px;height:15px;margin-right:9px;vertical-align:-2px;background:var(--volt);
clip-path:polygon(62% 0,0 56%,44% 56%,30% 100%,100% 40%,56% 40%);filter:drop-shadow(0 0 6px var(--volt))}
.chart-toggle{background:rgba(255,255,255,.04)}
.chart-toggle button.active{background:linear-gradient(135deg,#ffe14d,#ffb700);color:#171100;box-shadow:0 2px 14px rgba(255,200,0,.4)}

/* gráficos: planos con brillo eléctrico */
.chart-svg{transform:none;filter:drop-shadow(0 0 14px rgba(255,214,10,.12))}
.mix-wrap>svg{transform:none;filter:drop-shadow(0 0 16px rgba(255,214,10,.2))}
.legend-item i,.mix-row i,.bar-code i,.clase-name i{border-radius:50%}
.bar-track,.quin-bar,.clase-bar{background:rgba(255,255,255,.07)}
.bar-fill,.quin-bar-fill,.clase-bar div{position:relative;overflow:hidden;box-shadow:0 0 14px rgba(255,214,10,.28)}
.bar-fill::after,.quin-bar-fill::after,.clase-bar div::after{content:'';position:absolute;inset:0;
background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);animation:vshine 2.6s ease-in-out infinite}
.mix-row,.quin-card,.clase-card{border-radius:14px;background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.08)}
.quin-card:hover,.clase-card:hover{border-color:var(--border-hi);box-shadow:0 14px 34px rgba(0,0,0,.4),0 0 26px rgba(255,214,10,.08)}
.mix-row.sel,.bar-row.sel{border-color:var(--volt);background:rgba(255,214,10,.07);box-shadow:0 0 0 1px rgba(255,214,10,.25),0 0 28px rgba(255,214,10,.1)}
.bar-row:hover{background:rgba(255,255,255,.04)}
.tipo-pill:not(.active):hover{border-color:var(--volt)}

/* tablas */
.table thead th{background:rgba(12,14,22,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border-hi);letter-spacing:.12em}

.table tbody tr.total-row{background:rgba(255,214,10,.07)}
.btn-import{background:linear-gradient(135deg,#ffe14d,#ffae00);color:#171100}

/* acceso */
#gate{background:radial-gradient(800px 480px at 50% 40%,rgba(5,6,10,.18),rgba(5,6,10,.6));backdrop-filter:blur(1.5px);font-family:var(--font-d)}
#gf{position:relative;border:0;border-radius:24px;background:rgba(12,14,22,.8);backdrop-filter:blur(18px);box-shadow:0 40px 90px -20px #000,0 0 60px rgba(255,214,10,.1)}

#gb::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);animation:vshine 3s ease-in-out infinite}
#gb:active{box-shadow:0 1px 0 #7a5200}

@media (prefers-reduced-motion:reduce){
.app-header::after,#gf::before,.stat::before,.panel::before,.bar-fill::after,.quin-bar-fill::after,.clase-bar div::after,

<script>
/* Alternador de tema día/noche — solo diseño, no toca la lógica ni los datos */
(function(){
  function applyTheme(t){
    var light=(t==='light');
    document.body.classList.toggle('light',light);
    var b=document.getElementById('theme-toggle');
    if(b){
      b.textContent=light?'\u2600\uFE0F':'\u{1F319}';
      b.title=light?'Cambiar a modo noche':'Cambiar a modo d\xeda';
      b.setAttribute('aria-pressed',light?'true':'false');
    }
    try{localStorage.setItem('noche-theme',light?'light':'dark')}catch(e){}
  }
  var saved=null;
  try{saved=localStorage.getItem('noche-theme')}catch(e){}
  if(saved!=='light'&&saved!=='dark'){saved=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
  var btn=document.createElement('button');
  btn.id='theme-toggle';btn.type='button';
  btn.setAttribute('aria-label','Alternar tema d\xeda / noche');
  btn.addEventListener('click',function(){applyTheme(document.body.classList.contains('light')?'dark':'light')});
  document.body.appendChild(btn);
  applyTheme(saved);
})();
</script>

var fxc=E.fx.getContext('2d'),DPR=Math.min(devicePixelRatio||1,1.5),parts=[],arcs=[],flashes=[];

var COLS=['255,214,10','255,240,150','111,183,255','255,255,255'];
function spark(x,y,n,spd,col){
  if(RM)return;
  for(var i=0;i<n&&parts.length<260;i++){
    var a=Math.random()*6.283,v=rnd(.3,1)*spd,l=rnd(.25,.7);
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:l,m:l,s:rnd(1,2.8),c:col||pick(COLS)});
  }
}
function arc(ax,ay,bx,by,w,life){
  if(RM)return;
  var d=Math.hypot(bx-ax,by-ay)||1,n=Math.max(4,d/16|0),nx=-(by-ay)/d,ny=(bx-ax)/d,p=[[ax,ay]];
  for(var i=1;i<n;i++){var t=i/n,j=(Math.random()-.5)*Math.min(40,d*.2)*Math.sin(Math.PI*t);
    p.push([ax+(bx-ax)*t+nx*j,ay+(by-ay)*t+ny*j])}
  p.push([bx,by]);arcs.push({p:p,w:w,l:life,m:life});
}
function flash(x,y,r){if(!RM)flashes.push({x:x,y:y,r:r,l:.45,m:.45})}
function drawFx(dt){
  if(!parts.length&&!arcs.length&&!flashes.length){if(drawFx.dirty){fxc.clearRect(0,0,innerWidth,innerHeight);drawFx.dirty=false}return}
  drawFx.dirty=true;
  fxc.clearRect(0,0,innerWidth,innerHeight);fxc.globalCompositeOperation='lighter';
  var i,j,o;
  for(i=flashes.length-1;i>=0;i--){o=flashes[i];o.l-=dt;if(o.l<=0){flashes.splice(i,1);continue}
    var f=o.l/o.m,g=fxc.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r*(1.4-f*.4));
    g.addColorStop(0,'rgba(255,240,170,'+(.55*f)+')');g.addColorStop(1,'rgba(255,214,10,0)');
    fxc.fillStyle=g;fxc.beginPath();fxc.arc(o.x,o.y,o.r*1.4,0,6.283);fxc.fill()}
  for(i=arcs.length-1;i>=0;i--){o=arcs[i];o.l-=dt;if(o.l<=0){arcs.splice(i,1);continue}
    var fl=o.l/o.m*(Math.random()>.28?1:.45),L=[[9*o.w,.08,'111,183,255'],[3.4*o.w,.38,'111,183,255'],[1.3*o.w,1,'255,255,255']];
    for(j=0;j<3;j++){fxc.strokeStyle='rgba('+L[j][2]+','+(fl*L[j][1])+')';fxc.lineWidth=L[j][0];fxc.lineJoin='round';fxc.beginPath();
      for(var q=0;q<o.p.length;q++)q?fxc.lineTo(o.p[q][0],o.p[q][1]):fxc.moveTo(o.p[q][0],o.p[q][1]);fxc.stroke()}}
  for(i=parts.length-1;i>=0;i--){o=parts[i];o.l-=dt;if(o.l<=0){parts.splice(i,1);continue}
    o.x+=o.vx*dt;o.y+=o.vy*dt;o.vx*=.96;o.vy=o.vy*.96+60*dt;
    fxc.fillStyle='rgba('+o.c+','+(o.l/o.m)+')';fxc.beginPath();fxc.arc(o.x,o.y,o.s*(.4+o.l/o.m*.6),0,6.283);fxc.fill()}
  fxc.globalCompositeOperation='source-over';
}

var bubS={on:false,prio:-1,until:0,sticky:false,menu:false,w:240,h:60,hov:false};
E.bp.addEventListener('pointerenter',function(){bubS.hov=true});
E.bp.addEventListener('pointerleave',function(){bubS.hov=false;if(!bubS.sticky)bubS.until=performance.now()+2500});
function hush(){if(!bubS.on)return;E.bub.classList.remove('on');bubS.on=false;bubS.sticky=false;bubS.menu=false;bubS.prio=-1}
function say(o){
  if(!o)return false;
  var prio=o.prio||0,now=performance.now();
  if(bubS.on&&bubS.prio>prio&&(bubS.sticky||now<bubS.until))return false;
  if(!prefs.talk&&!o.force&&prio<4)return false;
  if(prefs.hidden&&!o.force)return false;
  E.t.textContent=o.title||'';E.x.textContent=o.text||'';E.prog.textContent=o.prog||'';
  E.btns.textContent='';
  (o.btns||[]).forEach(function(b){
    var el=D.createElement('button');el.type='button';el.className='ch-b'+(b.pri?' pri':'');el.textContent=b.t;
    if(b.sw){el.setAttribute('role','switch');el.setAttribute('aria-checked',b.on?'true':'false')}
    el.addEventListener('click',function(ev){ev.stopPropagation();b.fn&&b.fn()});
    E.btns.appendChild(el);
  });
  E.close.style.display=(o.sticky||(o.btns&&o.btns.length))?'':'none';
  E.bub.classList.remove('on');void E.bub.offsetWidth;E.bub.classList.add('on');
  bubS.w=E.bub.offsetWidth;bubS.h=E.bub.offsetHeight;
  bubS.key='';bubS.on=true;bubS.prio=prio;bubS.sticky=!!o.sticky;bubS.menu=!!o.menu;bubS.hov=false;
  bubS.until=o.sticky?Infinity:now+(o.ttl||Math.min(11000,3400+(o.text||'').length*55));
  S.talk=Math.min(2.4,.5+(o.text||'').length/55);
  if(o.mood)setMood(o.mood,o.moodT||1.6);
  placeBubble();return true;
}
function avoidRect(){
  var el=(typing.el&&performance.now()-typing.t<6000)?typing.el:S.track;
  if(!el||!el.isConnected)return null;
  return (el.closest('form,.panel,.stat')||el).getBoundingClientRect();
}
function ovl(x,y,w,h,r){
  if(!r)return 0;
  var ox=Math.min(x+w,r.right+6)-Math.max(x,r.left-6),oy=Math.min(y+h,r.bottom+6)-Math.max(y,r.top-6);
  return(ox>0&&oy>0)?ox*oy:0;
}
function placeBubble(){
  if(!bubS.on)return;
  var W=innerWidth,H=innerHeight,bw=bubS.w,bh=bubS.h,pref=S.y<H*.46?'below':'above',av=avoidRect(),best=null,prev=null,i,j;
  var sides=[pref,pref==='below'?'above':'below'];
  for(i=0;i<2;i++)for(j=0;j<3;j++){
    var side=sides[i],bx=j===0?S.x-bw/2:j===1?S.x-bw+36:S.x-36;
    bx=clamp(bx,12,Math.max(12,W-bw-12));
    var by=side==='below'?S.y+BH*.5+12:S.y-BH*.5-12-bh;
    var bad=(by<8||by+bh>H-8)?1e7:0,score=bad+ovl(bx,by,bw,bh,av)+(i?60:0)+(j?25:0),key=side+j,c={bx:bx,by:by,side:side,score:score,key:key};
    if(key===bubS.key)prev=c;
    if(!best||score<best.score)best=c;
  }
  var pick2=(prev&&prev.score<=best.score+90)?prev:best;
  if(pick2.by<8)pick2.by=8;if(pick2.by+bh>H-8)pick2.by=Math.max(8,H-8-bh);
  bubS.key=pick2.key;
  E.bp.style.transform='translate('+pick2.bx.toFixed(1)+'px,'+pick2.by.toFixed(1)+'px)';
  E.bub.setAttribute('data-s',pick2.side);
  E.bub.style.setProperty('--tx',clamp(S.x-pick2.bx,20,bw-20).toFixed(0)+'px');
  E.bub.style.setProperty('--oy',pick2.side==='below'?'0%':'100%');
}

/* ---------- guía por la pantalla (tour) ---------- */
function buildTour(){
  var s=[],gate=$('#gate'),add=function(el,title,text){if(el&&vis(el))s.push({el:el,title:title,text:text})};
  if(gate&&vis(gate)){
    ['#gf','#ge','#gk','#gb'].forEach(function(q){var el=$(q),d=el&&describe(el);if(d)add(el,d.title,d.text)});
    return s;
  }
  var hd=$('.app-header');if(hd){var d=describe(hd);add(hd,d.title,d.text)}
  var tb=$('.tabs');if(tb){var d2=describe(tb);add(tb,d2.title,d2.text)}
  var fb=$('.filter-bar');if(fb){var d3=describe(fb);add(fb,d3.title,d3.text)}
  var kp=$('.kpis');
  if(kp){var st=$$('.stat',kp);add(kp,'Indicadores clave',cut(st.slice(0,4).map(function(x){return T(x,'.stat-label')+': '+T(x,'.stat-value')}).join(' · ')+(st.length>4?' · y '+(st.length-4)+' más':''),230))}
  $$('.panel').filter(vis).slice(0,8).forEach(function(p){var dp=describe(p);add(p,dp.title,dp.text)});
  add($('.foot'),'Pie de página',cut(T(D,'.foot'),150));
  add($('#theme-toggle'),'Modo día y noche','Este botón cambia el aspecto de toda la página. ¡Pruébalo!');
  var sb=$('#sbar');if(sb){var d4=describe(sb);add(sb,d4.title,d4.text)}
  return s;
}
function startTour(){
  var steps=buildTour();
  if(!steps.length){say({text:'Todavía no hay nada para mostrar. Dame un segundito \u23F3',prio:4,ttl:3000,force:true});return}
  tour={steps:steps,i:-1};stepTour(1);
}
function stepTour(dir){
  if(!tour)return;
  var i=tour.i+dir;
  while(i>=0&&i<tour.steps.length&&!vis(tour.steps[i].el))i+=dir;
  if(i<0)i=0;
  if(i>=tour.steps.length){endTour(false);return}
  tour.i=i;var st=tour.steps[i],last=i===tour.steps.length-1;
  scrollTo2(st.el);
  setMood('curious',.8);
  goTo(st.el,{hold:0,onArrive:function(){
    if(!tour)return;
    say({title:st.title,text:st.text,prio:5,sticky:true,force:true,prog:(i+1)+' de '+tour.steps.length,mood:'grin',moodT:1.2,btns:[
      {t:'Anterior',fn:function(){stepTour(-1)}},
      {t:last?'Terminar':'Siguiente',pri:1,fn:function(){stepTour(1)}},
      {t:'Salir',fn:function(){endTour(true)}}]});
  }});
  hush();
}
function endTour(manual){
  if(!tour)return;tour=null;release();hush();
  setMood('grin',1.6);spark(S.x,S.y,18,230);
  say({text:manual?'¡Cuando quieras repetimos! Tócame y te muestro más \u26A1':'¡Eso fue todo! Si dudas de algo, haz clic en la opción y te cuento qué es \u26A1',prio:4,ttl:4200,force:true});
}

    E.dark.classList.remove('on');void E.dark.offsetWidth;E.dark.classList.add('on');
    setTimeout(function(){E.dark.classList.remove('on')},1500);
    say({text:'¡Uy! Pisé un cable… \uD83D\uDD0C\uD83D\uDE05',prio:0,ttl:3200})},
    update:function(dt){this.t+=dt;return this.t>1.4}};
}
function pickTask(){
  var now=performance.now(),pr=prefs.pranks&&!RM&&!gateBusy(),dash=!!$('.kpis .stat'),pool=[];
  if(RM)return Math.random()<.5?tLook():null;
  pool.push([tWander,40],[tZig,14],[tSpin,6],[tHiccup,7],[tLook,10]);
  if(now-P.t<5000)pool.push([tOrbit,9]);
  if(pr&&dash){pool.push([tZap,16],[tTickle,4]);if(now-lastDim>240000)pool.push([tDim,1])}
  if(pr)pool.push([tPeek,8]);
  var tot=pool.reduce(function(a,b){return a+b[1]},0),r=Math.random()*tot;
  for(var i=0;i<pool.length;i++){r-=pool[i][1];if(r<=0)return pool[i][0]()}
  return tWander();
}
var chatter=[
  'Tócame y te hago un tour por toda la pantalla \u26A1',
  'Haz clic en cualquier opción y te cuento qué es \uD83D\uDC40',
  'Estoy aburrido… creo que haré una travesura \uD83D\uDE08',
  'Si pasas el cursor por un indicador, me acerco a explicarlo.',
  '¿Sabías que me puedes arrastrar y lanzar por la pantalla? \uD83C\uDFAF'
];

/* ---------- entrada y saludo ---------- */
function enter(){
  var h=home();S.x=S.tx=h.x;S.y=S.ty=h.y;S.vx=S.vy=0;
  E.me.classList.remove('appear');void E.me.offsetWidth;E.me.classList.add('appear');
  arc(S.x+rnd(-30,30),-20,S.x,S.y,2.6,.55);arc(S.x+rnd(-60,60),-20,S.x,S.y,1.4,.45);
  flash(S.x,S.y,90);spark(S.x,S.y,28,300);setMood('grin',1.6);
}
var greeted=false,gateSeen=false,dashSeen=false;
function scan(first){
  var gate=$('#gate'),gOn=!!(gate&&vis(gate)),dash=!!$('.kpis .stat,.app-header');
  var gm=$('#gm');if(gm&&gm!==gmEl){gmEl=gm;gmObs.disconnect();gmObs.observe(gm,{childList:true,characterData:true,subtree:true,attributes:true,attributeFilter:['class']})}
  if(gOn)gateSeen=true;
  if(!greeted&&first){
    if(gOn){greeted=true;
      say({title:'¡Hola! Soy Chispa \u26A1',text:'Te acompaño en esta página. Ingresa tu empresa y tu clave (yo no miro la clave \uD83D\uDE48).',prio:3,ttl:9000,
        btns:[{t:'Hacer el tour',pri:1,fn:function(){hush();startTour()}},{t:'Luego',fn:hush}]})}
    else if(dash){greeted=dashSeen=true;greetDash('¡Hola de nuevo!')}
    return;
  }
  if(!gOn&&gateSeen&&dash&&!dashSeen){dashSeen=true;greeted=true;celebrate()}
}
function greetDash(pre){
  var n=$$('.stat').length,p=$$('.panel').length;
  say({title:pre+' \u26A1',text:'Veo '+n+' indicadores y '+p+' paneles. ¿Te muestro cómo se usa cada cosa?',prio:3,ttl:10000,mood:'grin',
    btns:[{t:'Hacer el tour',pri:1,fn:function(){hush();startTour()}},{t:'Luego',fn:hush}]});
}
function celebrate(){
  setMood('grin',3);S.pulse=1.4;flash(S.x,S.y,110);
  for(var i=0;i<5;i++)arc(S.x,S.y,S.x+rnd(-200,200),S.y+rnd(-220,-30),1.4,.5);
  spark(S.x,S.y,40,360);
  var tries=0,iv=setInterval(function(){
    tries++;if($$('.stat').length||tries>14){clearInterval(iv);greetDash('¡Acceso concedido!')}
  },350);
}

/* ---------- bucle principal ---------- */
var last=performance.now(),nextBlink=2.5,glanceT=0,idleNote=0;
function lookPoint(now){
  var c=S.dizzy>0?null:curMood();
  if(c==='sleep'||c==='shy')return null;
  if(drag)return P;
  if(typing.el&&now-typing.t<6000){
    var r=typing.el.getBoundingClientRect(),v=isSecret(typing.el)?0:(typing.el.value||'').length;
    return{x:r.left+Math.min(14+v*7.4,Math.max(20,r.width-18)),y:r.top+r.height/2};
  }
  if(S.track&&S.arrived&&S.track.isConnected){var rr=S.track.getBoundingClientRect();return{x:rr.left+rr.width/2,y:rr.top+rr.height/2}}
  if(now-P.t<5000)return P;
  if(now>S.glance.t){
    var els=$$('.stat,.panel,.tab,.chip-toggle').filter(function(e){return inView(e,.5)});
    var e2=els.length?pick(els).getBoundingClientRect():null;
    S.glance={x:e2?e2.left+e2.width/2:rnd(0,innerWidth),y:e2?e2.top+e2.height/2:rnd(0,innerHeight),t:now+rnd(1400,3200)};
  }
  return S.glance;
}
function frame(now){
  requestAnimationFrame(frame);
  if(D.hidden){last=now;return}
  var dt=Math.min(.05,(now-last)/1000);last=now;S.time+=dt;
  var i,m;

  /* sueño por inactividad */
  if(!S.sleeping&&!tour&&!drag&&!S.track&&!bubS.on&&now-lastAct>70000&&!(task&&task.n==='nap')){nap(false)}

  /* seguimiento de un elemento */
  if(S.track){
    if(!S.track.isConnected||(S.holdUntil!==Infinity&&now>S.holdUntil)){release()}
    else{
      var r=visRect(S.track),dk=dockFor(r,S.dock);S.tx=dk.x;S.ty=dk.y;
      S.arrT+=dt;
      if(!S.arrived&&((Math.hypot(S.tx-S.x,S.ty-S.y)<20&&Math.hypot(S.vx,S.vy)<140)||S.arrT>1.9)){
        S.arrived=true;var f=S.onArrive;S.onArrive=null;if(f)f();
      }
    }
  }
  if(ringEl){
    if(!ringEl.isConnected)ringOff();
    else{var rr=ringEl.getBoundingClientRect(),off=rr.bottom<0||rr.top>innerHeight;
      E.ring.style.opacity=off?0:'';
      E.ring.style.transform='translate('+(rr.left-4)+'px,'+(rr.top-4)+'px)';
      E.ring.style.width=(rr.width+8)+'px';E.ring.style.height=(rr.height+8)+'px'}
  }

  /* tareas / física */
  var freeTask=!S.track&&!drag&&!tour&&!S.sleeping&&!(typing.el&&now-typing.t<4500);
  if(task&&task.n==='fly'){
    S.x+=S.vx*dt;S.y+=S.vy*dt;S.vx*=Math.pow(.42,dt);S.vy*=Math.pow(.42,dt);
    var hw=BW/2,hh=BH/2;
    if(S.x<hw){S.x=hw;S.vx=Math.abs(S.vx)*.8;spark(S.x,S.y,8,180);S.pulse=.8}
    if(S.x>innerWidth-hw){S.x=innerWidth-hw;S.vx=-Math.abs(S.vx)*.8;spark(S.x,S.y,8,180);S.pulse=.8}
    if(S.y<hh){S.y=hh;S.vy=Math.abs(S.vy)*.8;spark(S.x,S.y,8,180);S.pulse=.8}
    if(S.y>innerHeight-hh){S.y=innerHeight-hh;S.vy=-Math.abs(S.vy)*.8;spark(S.x,S.y,8,180);S.pulse=.8}
    S.tx=S.x;S.ty=S.y;
    if(task.update(dt)){task=null;S.pause=.4}
  }else if(!drag){
    if(task&&task.n!=='nap'&&task.update(dt)){setTask(null);S.pause=rnd(.35,1.5)}
    if(!task&&freeTask){
      S.pause-=dt;
      if(S.pause<=0){
        if(now-lastAct>8000&&now-lastIdleSay>38000&&prefs.talk&&!bubS.on&&!RM&&Math.random()<.5&&!gateBusy()){lastIdleSay=now;say({text:pick(chatter),prio:0,ttl:4800})}
        var tk=pickTask();if(tk)setTask(tk);else S.pause=rnd(4,9);
      }
    }
    /* resorte hacia el objetivo */
    var K=S.K,Dm=S.D;
    if(!task&&freeTask&&!S.track){K=RM?30:34;Dm=RM?10:7}
    var ax=(S.tx-S.x)*K-S.vx*Dm,ay=(S.ty-S.y)*K-S.vy*Dm;
    if(!RM&&freeTask&&!S.sleeping){
      ax+=(Math.random()-.5)*(task?500:900);ay+=(Math.random()-.5)*(task?500:900);
      S.twT-=dt;
      if(S.twT<=0){S.twT=rnd(.25,.9);S.vx+=rnd(-110,110);S.vy+=rnd(-110,110);if(Math.random()<.35)spark(S.x,S.y,3,90)}
    }
    S.vx+=ax*dt;S.vy+=ay*dt;S.x+=S.vx*dt;S.y+=S.vy*dt;
    if(!S.free){
      var hw2=BW/2,hh2=BH/2;
      if(S.x<hw2){S.x=hw2;S.vx=Math.abs(S.vx)*.5}if(S.x>innerWidth-hw2){S.x=innerWidth-hw2;S.vx=-Math.abs(S.vx)*.5}
      if(S.y<hh2){S.y=hh2;S.vy=Math.abs(S.vy)*.5}if(S.y>innerHeight-hh2){S.y=innerHeight-hh2;S.vy=-Math.abs(S.vy)*.5}
    }
  }
  var sp=Math.hypot(S.vx,S.vy);
  if(!RM&&sp>380&&Math.random()<.6)spark(S.x+rnd(-6,6),S.y+rnd(-6,6),1,50);

  /* contadores de estado */
  if(S.mot>0){S.mot-=dt;if(S.mot<=0)S.mo=null}
  if(S.talk>0)S.talk-=dt;
  if(S.dizzy>0)S.dizzy-=dt;
  S.pulse*=Math.pow(.02,dt);
  if(S.spinV){S.spin+=S.spinV*dt;S.spinV*=Math.pow(.25,dt);if(S.spinV<60){S.spinV=0;S.spin=0}}

  /* parpadeo */
  nextBlink-=dt;
  if(nextBlink<=0){S.shut=1;setTimeout(function(){S.shut=0},Math.random()<.2?60:120);nextBlink=rnd(1.8,5);if(Math.random()<.2)nextBlink=.22}

  /* mirada */
  var lp=lookPoint(now),tx2=0,ty2=0,fx2=0,fy2=0;
  if(S.dizzy>0){tx2=Math.cos(S.time*14)*3.2;ty2=Math.sin(S.time*14)*3.2}
  else if(lp){var dx=lp.x-S.x,dy=lp.y-S.y,d=Math.hypot(dx,dy)||1,k=Math.min(1,d/150);
    tx2=dx/d*3.9*k;ty2=dy/d*3.9*k;fx2=dx/d*1.6*k;fy2=dy/d*1.2*k}
  var ps=Math.min(1,dt*14);S.px+=(tx2-S.px)*ps;S.py+=(ty2-S.py)*ps;S.fx+=(fx2-S.fx)*ps;S.fy+=(fy2-S.fy)*ps;
  var pt='translate('+S.px.toFixed(2)+' '+S.py.toFixed(2)+')';
  E.pl.setAttribute('transform',pt);E.pr.setAttribute('transform',pt);
  E.face.setAttribute('transform','translate('+S.fx.toFixed(2)+' '+S.fy.toFixed(2)+')');
  applyFace();

  /* dibujar cuerpo */
  var bob=(RM||S.sleeping)?0:Math.sin(S.time*3.1)*1.6,
      rt=clamp(S.vx*.045,-24,24)+(S.sleeping?-14:0)+(RM?0:Math.sin(S.time*5)*1.6),
      tilt=rt+S.spin;
  S.rot+=(tilt-S.rot)*Math.min(1,dt*(S.spinV?60:10));
  var stretch=Math.min(.22,Math.abs(S.vy)/3200+Math.abs(S.vx)/5200),sx=1-stretch*.55+S.pulse*.12,sy=1+stretch+S.pulse*.12*-.6+(S.pulse?0:0);
  if(!RM)sy+=Math.sin(S.time*3.1+1)*.012;
  E.me.style.transform='translate3d('+S.x.toFixed(1)+'px,'+(S.y+bob).toFixed(1)+'px,0)';
  E.body.style.transform='rotate('+S.rot.toFixed(1)+'deg) scale('+sx.toFixed(3)+','+sy.toFixed(3)+')';
  if(bubS.on){
    if(!bubS.sticky&&!bubS.hov&&now>bubS.until)hush();else placeBubble();
  }
  drawFx(dt);
}

/* ---------- arranque ---------- */
if(prefs.hidden)setHidden(true);
else enter();
setTimeout(function(){scan(true)},1700);
setInterval(function(){scan(false)},800);
requestAnimationFrame(function(t){last=t;requestAnimationFrame(frame)});

window.__chispa={tour:startTour,say:say,menu:openMenu,zap:function(el){zapEl(el)},state:S,nap:nap,describe:describe};
})();

</script>
